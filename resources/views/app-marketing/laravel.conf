<VirtualHost *:80>
    ServerAdmin admin@example.com
    ServerName mydomain.com
    DocumentRoot /var/www/html/App_logActivity/public

    <Directory /var/www/html/App_logActivity>
    Options Indexes MultiViews FollowSymLinks
    AllowOverride All
    Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>



# 1. Block HTTP (Redirect otomatis ke HTTPS)
<VirtualHost *:80>
    ServerName mydomain.com
    ServerAlias 192.168.50.222

    Redirect permanent / http://logit.pramita.co.id:2023/
</VirtualHost>

# 2. Block HTTPS (Konfigurasi Utama dengan SSL)
<VirtualHost *:443>
    ServerAdmin admin@example.com
    ServerName mydomain.com
    ServerAlias 192.168.50.222
    DocumentRoot /var/www/html/App_logActivity/public

    <Directory /var/www/html/App_logActivity/public>
        Options Indexes MultiViews FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Konfigurasi Sertifikat SSL
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/apache-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
